<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>WEDZX AI | SYSTEM V3</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #ff003c; --bg: #050508; }
        body { margin: 0; background: var(--bg); color: white; font-family: 'Rajdhani', sans-serif; overflow: hidden; }
        
        /* Arka Plan Ağı */
        canvas { position: absolute; top: 0; left: 0; z-index: 0; }

        /* Paneller */
        .ui-container { position: relative; z-index: 1; height: 100vh; display: flex; justify-content: center; align-items: center; }
        .panel { 
            background: rgba(10, 10, 15, 0.85); 
            border: 1px solid var(--neon); 
            padding: 30px; border-radius: 20px; 
            width: 350px; text-align: center; 
            box-shadow: 0 0 30px rgba(255, 0, 60, 0.3);
            backdrop-filter: blur(10px);
        }

        h1 { font-family: 'Orbitron', sans-serif; color: var(--neon); text-shadow: 0 0 10px var(--neon); margin-bottom: 20px; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; background: rgba(0,0,0,0.5); border: 1px solid #444; color: white; border-radius: 8px; }
        
        button { 
            width: 100%; padding: 15px; background: var(--neon); border: none; 
            color: white; font-weight: bold; cursor: pointer; border-radius: 8px; 
            font-family: 'Orbitron', sans-serif; transition: 0.3s;
        }
        button:hover { box-shadow: 0 0 20px var(--neon); transform: translateY(-2px); }

        .data-row { display: flex; justify-content: space-between; margin: 10px 0; padding-bottom: 5px; border-bottom: 1px solid #333; }
        .val { color: var(--neon); font-weight: bold; }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <div class="ui-container">
        <!-- 1. KİLİT EKRANI -->
        <div id="gate" class="panel">
            <h1>WEDZX ACCESS</h1>
            <p>Sistemi kullanmak için takip et.</p>
            <button onclick="window.open('https://www.tiktok.com/@wedzx_', '_blank'); document.getElementById('btn-enter').disabled=false;">TAKİP ET</button>
            <button id="btn-enter" onclick="show('selector')" disabled style="margin-top:10px; background:#444;">GİRİŞ YAP</button>
        </div>

        <!-- 2. SEÇİM EKRANI -->
        <div id="selector" class="panel" style="display:none;">
            <h1>DEVICE SCAN</h1>
            <select id="brand"><option value="iPhone">iPhone</option><option value="Android">Samsung / Xiaomi / Diğer</option></select>
            <input type="text" id="model" placeholder="Telefon Modeli Yaz...">
            <button onclick="process()">ANALİZ ET</button>
        </div>

        <!-- 3. YÜKLEME EKRANI -->
        <div id="loading" class="panel" style="display:none;">
            <h1>PROCESSING...</h1>
            <div id="status" style="margin-top:20px;">Veri paketleri işleniyor...</div>
        </div>

        <!-- 4. SONUÇ EKRANI -->
        <div id="results" class="panel" style="display:none;">
            <h1>AI OPTIMIZED</h1>
            <div id="data-list"></div>
            <button onclick="location.reload()" style="margin-top:20px;">YENİLE</button>
        </div>
    </div>

    <script>
        // --- NEON AĞ ANIMASYONU ---
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function init() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            for(let i=0; i<60; i++) particles.push({x:Math.random()*canvas.width, y:Math.random()*canvas.height, vx:Math.random()-0.5, vy:Math.random()-0.5});
        }
        function draw() {
            ctx.fillStyle = '#050508'; ctx.fillRect(0,0,canvas.width, canvas.height);
            particles.forEach((p, i) => {
                p.x += p.vx; p.y += p.vy;
                if(p.x<0 || p.x>canvas.width) p.vx*=-1; if(p.y<0 || p.y>canvas.height) p.vy*=-1;
                ctx.fillStyle = '#ff003c'; ctx.beginPath(); ctx.arc(p.x, p.y, 1.5, 0, Math.PI*2); ctx.fill();
                for(let j=i+1; j<particles.length; j++) {
                    let d = Math.hypot(p.x-particles[j].x, p.y-particles[j].y);
                    if(d<150) { ctx.strokeStyle = `rgba(255,0,60,${1-d/150})`; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(particles[j].x, particles[j].y); ctx.stroke(); }
                }
            });
            requestAnimationFrame(draw);
        }
        init(); draw();

        // --- MANTIK ---
        function show(id) { 
            document.querySelectorAll('.panel').forEach(p => p.style.display='none');
            document.getElementById(id).style.display='block';
        }

        function process() {
            if(!document.getElementById('model').value) return alert("Model gir!");
            show('loading');
            setTimeout(()=>document.getElementById('status').innerText="Donanım matrisi kuruluyor...", 1000);
            setTimeout(()=>document.getElementById('status').innerText="Sens hassasiyeti optimize ediliyor...", 2500);
            setTimeout(() => {
                const b = document.getElementById('brand').value;
                const seed = document.getElementById('model').value.length;
                const rand = (min, max) => Math.floor(Math.random() * (max - min + 1) + min);
                
                const sMin = b === 'iPhone' ? 40 : 80;
                const sMax = b === 'iPhone' ? 120 : 100;
                const dMin = b === 'iPhone' ? 50 : 100;
                const dMax = b === 'iPhone' ? 120 : 200;

                const data = {
                    "DPI": rand(dMin, dMax),
                    "Genel": rand(sMin, sMax),
                    "Kırmızı Nokta": rand(sMin, sMax),
                    "2x Dürbün": rand(sMin, sMax),
                    "4x Dürbün": rand(sMin, sMax),
                    "Tüfek Dürbünü": rand(sMin, sMax),
                    "Serbest Bakış": rand(sMin, sMax)
                };

                let html = "";
                for(let k in data) html += `<div class="data-row"><span>${k}</span><span class="val">${data[k]}</span></div>`;
                document.getElementById('data-list').innerHTML = html;
                show('results');
            }, 4000);
        }
    </script>
</body>
</html>
