<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedzx V3 - AI Sensitivity Matrix</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap');

        :root {
            --neon-red: #ff003c;
            --neon-blue: #00d4ff;
            --bg-dark: #050505;
            --panel-bg: rgba(10, 10, 15, 0.8);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Rajdhani', sans-serif; user-select: none; }

        body { background-color: var(--bg-dark); color: #fff; overflow: hidden; height: 100vh; display: flex; justify-content: center; align-items: center; }

        #bg-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        .cyber-container {
            position: relative; z-index: 2; background: var(--panel-bg);
            border: 1px solid rgba(255, 0, 60, 0.3); border-radius: 12px;
            padding: 30px 25px; width: 90%; max-width: 480px; max-height: 95vh; overflow-y: auto;
            text-align: center; backdrop-filter: blur(15px);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.1), inset 0 0 20px rgba(255, 0, 60, 0.05);
        }

        h2 { font-size: 28px; color: #fff; letter-spacing: 3px; margin-bottom: 5px; text-shadow: 0 0 10px var(--neon-red); text-transform: uppercase; }
        
        /* Geri kalan CSS aynı, sadece input/select renklerini güncelliyoruz */
        label { color: var(--neon-blue); }
        .cyber-btn { border: 2px solid var(--neon-blue); color: #fff; }
        .cyber-btn:hover { box-shadow: 0 0 20px var(--neon-blue); }
        
        .res-val { color: var(--neon-blue); text-shadow: 0 0 10px var(--neon-blue); }
        .res-item { border-bottom: 1px dashed rgba(0, 212, 255, 0.1); }
        
        #main-panel { display: none; }
        .error-shake { animation: shake 0.4s ease-in-out; border-color: var(--neon-red) !important; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="cyber-container" id="gate-screen">
        <div class="tiktok-icon" style="font-size: 45px; margin-bottom: 10px;">📱</div>
        <h2>SİSTEM KORUMASI</h2>
        <p>WEDZX V3 erişimi için <b>@wedzx_</b> hesabını takip et.</p>
        <a href="https://www.tiktok.com/@wedzx_" target="_blank" class="cyber-btn" id="follow-btn">TAKİP ET</a>
        <button class="cyber-btn" id="verify-btn" style="display: none; margin-top: 15px;">DOĞRULA</button>
    </div>

    <div class="cyber-container" id="main-panel">
        <h2>WEDZX V3 AI</h2>
        <div class="input-group"><label>Marka</label><select id="brand-select"><option value="apple">Apple</option><option value="samsung">Samsung</option><option value="xiaomi">Xiaomi</option><option value="other">Diğer</option></select></div>
        <div class="input-group"><label>Model</label><input type="text" id="model-input" placeholder="Model Giriniz..."></div>
        <button class="cyber-btn" id="generate-btn">HESAPLA</button>
        <div class="results" id="results-box" style="display:none; margin-top:15px; padding:15px; border-left:4px solid var(--neon-blue);">
            <div class="res-item"><span class="res-label">Genel:</span><span class="res-val" id="v-genel">0</span></div>
            <div class="res-item"><span class="res-label">Kırmızı Nokta:</span><span class="res-val" id="v-red">0</span></div>
            <div class="res-item"><span class="res-label">2x Dürbün:</span><span class="res-val" id="v-2x">0</span></div>
            <div class="res-item"><span class="res-label">4x Dürbün:</span><span class="res-val" id="v-4x">0</span></div>
            <div class="res-item"><span class="res-label">Tüfek Dürbünü:</span><span class="res-val" id="v-tufe">0</span></div>
            <div class="res-item"><span class="res-label">Serbest Bakış:</span><span class="res-val" id="v-serbest">0</span></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.onresize = resize; resize();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5); this.vy = (Math.random() - 0.5);
                this.color = Math.random() > 0.5 ? '#ff003c' : '#00d4ff'; // Kırmızı veya Mavi
            }
            update() { this.x += this.vx; this.y += this.vy; if(this.x<0||this.x>canvas.width) this.vx*=-1; if(this.y<0||this.y>canvas.height) this.vy*=-1; }
            draw() { ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x, this.y, 2, 0, Math.PI*2); ctx.fill(); }
        }

        for(let i=0; i<80; i++) particles.push(new Particle());

        function animate() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            for(let i=0; i<particles.length; i++) {
                for(let j=i+1; j<particles.length; j++) {
                    let dx = particles[i].x - particles[j].x;
                    let dy = particles[i].y - particles[j].y;
                    let dist = Math.sqrt(dx*dx + dy*dy);
                    if(dist < 150) {
                        ctx.beginPath(); ctx.moveTo(particles[i].x, particles[i].y); ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = particles[i].color; // Bağlantı hattı parçacığın renginde
                        ctx.globalAlpha = 1 - dist/150; ctx.stroke(); ctx.globalAlpha = 1;
                    }
                }
            }
            requestAnimationFrame(animate);
        }
        animate();

        // Doğrulama ve Hesaplama Mantığı (Bir önceki ile aynı)
        document.getElementById('follow-btn').onclick = () => { setTimeout(() => { document.getElementById('follow-btn').style.display='none'; document.getElementById('verify-btn').style.display='block'; }, 1000); };
        document.getElementById('verify-btn').onclick = () => { document.getElementById('gate-screen').style.display='none'; document.getElementById('main-panel').style.display='block'; };
        document.getElementById('generate-btn').onclick = () => {
            if(document.getElementById('model-input').value === "") { document.getElementById('model-input').classList.add('error-shake'); return; }
            document.getElementById('results-box').style.display = 'block';
            document.querySelectorAll('.res-val').forEach(el => el.innerText = Math.floor(Math.random()*(160-50)+50));
        };
    </script>
</body>
</html>
