<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedzx | Neural Sensitivity AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-red: #ff3e3e;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --border-light: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-dim: #b0b0b0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            background: radial-gradient(circle at center, #1a0505 0%, #050505 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Modern Glass Card */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-light);
            border-radius: 30px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            transition: transform 0.5s ease;
        }

        h1 { font-family: 'Rajdhani', sans-serif; font-size: 2rem; margin-bottom: 10px; letter-spacing: 2px; }
        .badge { background: var(--primary-red); padding: 5px 15px; border-radius: 20px; font-size: 0.8rem; text-transform: uppercase; margin-bottom: 20px; display: inline-block; }

        input, select {
            width: 100%;
            padding: 15px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px;
            color: white;
            margin-bottom: 15px;
            font-size: 1rem;
            outline: none;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--primary-red), #990000);
            border: none;
            border-radius: 15px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: block;
        }

        .btn:hover { transform: scale(1.02); box-shadow: 0 10px 20px rgba(255,62,62,0.3); }

        /* Sonuç Listesi */
        .result-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .result-val { color: var(--primary-red); font-weight: 700; }
        
        #result-container { display: none; }
    </style>
</head>
<body>

    <!-- 1. GİRİŞ KARTI -->
    <div id="gate-panel" class="glass-panel">
        <div class="badge">Erişim İzni Bekleniyor</div>
        <h1>WEDZX AI</h1>
        <p style="color:var(--text-dim); margin-bottom: 20px;">Sisteme giriş için önce geliştiriciyi TikTok'ta destekle.</p>
        <a href="https://www.tiktok.com/@wedzx_" target="_blank" id="tiktok-btn" class="btn">TIKTOK'TA TAKİP ET</a>
        <button id="gate-enter-btn" class="btn" style="margin-top:10px; background: #333;" disabled>GİRİŞ YAP</button>
    </div>

    <!-- 2. TELEFON SEÇİMİ -->
    <div id="device-panel" class="glass-panel" style="display: none;">
        <h1>CİHAZ AYARLARI</h1>
        <select id="brand">
            <option value="iPhone">Apple iPhone</option>
            <option value="Android">Samsung / Xiaomi / Diğer</option>
        </select>
        <input type="text" id="model" placeholder="Model Yazın (Örn: 15 Pro)">
        <button id="calc-btn" class="btn">ANALİZİ BAŞLAT</button>
    </div>

    <!-- 3. SONUÇLAR -->
    <div id="result-panel" class="glass-panel" style="display: none;">
        <h1>OPTİMİZE EDİLDİ</h1>
        <div id="results">
            <!-- JS ile dolacak -->
        </div>
        <button class="btn" onclick="location.reload()" style="background:transparent; border:1px solid #555; margin-top:20px;">YENİLE</button>
    </div>

    <script>
        // TikTok Kilit
        document.getElementById('tiktok-btn').onclick = () => {
            setTimeout(() => { document.getElementById('gate-enter-btn').disabled = false; document.getElementById('gate-enter-btn').style.background = 'var(--primary-red)'; }, 2000);
        };
        
        document.getElementById('gate-enter-btn').onclick = () => {
            document.getElementById('gate-panel').style.display = 'none';
            document.getElementById('device-panel').style.display = 'block';
        };

        // Analiz Mantığı
        document.getElementById('calc-btn').onclick = () => {
            const brand = document.getElementById('brand').value;
            const model = document.getElementById('model').value;
            if(!model) return alert("Model girmelisin!");

            document.getElementById('device-panel').style.display = 'none';
            document.getElementById('result-panel').style.display = 'block';

            // Seed üretimi (model ismine göre)
            let seed = model.split('').reduce((a, b) => a + b.charCodeAt(0), 0);
            const rand = (min, max) => Math.floor(Math.sin(seed++) * (max - min + 1) + (max + min) / 2);

            const isiPhone = brand === 'iPhone';
            const sMin = isiPhone ? 40 : 80;
            const sMax = isiPhone ? 120 : 100;
            const dpiMin = isiPhone ? 50 : 100;
            const dpiMax = isiPhone ? 120 : 200;

            const settings = {
                "DPI": rand(dpiMin, dpiMax),
                "Genel": rand(sMin, sMax),
                "Kırmızı Nokta": rand(sMin, sMax),
                "2x Dürbün": rand(sMin, sMax),
                "4x Dürbün": rand(sMin, sMax),
                "Tüfek Dürbünü": rand(sMin, sMax),
                "Serbest Bakış": rand(sMin, sMax)
            };

            let html = `<div style="margin-bottom:20px; font-weight:bold; color:#ff3e3e;">CİHAZ: ${model.toUpperCase()}</div>`;
            for(let key in settings) {
                html += `<div class="result-item"><span>${key}</span><span class="result-val">${settings[key]}</span></div>`;
            }
            document.getElementById('results').innerHTML = html;
        };
    </script>
</body>
</html>
