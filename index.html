<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEDZX V3 - Free Fire Hassasiyet Motoru (2026)</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #151a23;
            --accent-color: #00ffcc;
            --danger-color: #ff0055;
            --text-color: #ffffff;
            --subtext-color: #94a3b8;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            border: 2px solid var(--accent-color);
            border-radius: 16px;
            padding: 25px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
            transition: all 0.3s ease;
        }

        h2 {
            text-align: center;
            color: var(--accent-color);
            margin-top: 0;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: var(--subtext-color);
        }

        select, input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #2a3241;
            background-color: #0b0e14;
            color: #fff;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }

        select:focus, input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 8px rgba(0, 255, 204, 0.3);
        }

        .btn-tiktok {
            width: 100%;
            padding: 12px;
            background-color: transparent;
            color: var(--text-color);
            border: 2px solid #fe2c55;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 15px;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-tiktok.followed {
            border-color: var(--accent-color);
            color: var(--accent-color);
            background-color: rgba(0, 255, 204, 0.1);
        }

        .btn-calc {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-color);
            color: #000;
            font-weight: bold;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-calc:hover {
            box-shadow: 0 0 15px var(--accent-color);
            transform: translateY(-2px);
        }

        .results {
            margin-top: 25px;
            border-top: 1px solid #2a3241;
            padding-top: 15px;
            display: none;
        }

        .sens-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px dashed #2a3241;
            font-size: 15px;
        }

        .sens-value {
            color: var(--accent-color);
            font-weight: bold;
        }

        /* Hata / Ulaşım Animasyonu */
        @keyframes shake {
            0% { transform: translateX(0); }
            20% { transform: translateX(-10px); }
            40% { transform: translateX(10px); }
            60% { transform: translateX(-10px); }
            80% { transform: translateX(10px); }
            100% { transform: translateX(0); }
        }

        .shake-element {
            animation: shake 0.4s ease-in-out;
            border-color: var(--danger-color) !important;
            box-shadow: 0 0 15px var(--danger-color) !important;
        }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <h2>🎯 WEDZX V3 SENSI</h2>
    
    <button class="btn-tiktok" id="tiktokBtn" onclick="followTikTok()">
        <span id="tiktokStatus">🎵 TikTok Hesabını Takip Et</span>
    </button>

    <div class="form-group">
        <label for="device">Cihaz Türü / Ekran Hızı:</label>
        <select id="device">
            <option value="android_low">Android (60Hz - Giriş Segment)</option>
            <option value="android_mid">Android (90Hz - Orta Segment)</option>
            <option value="android_high">Android (120Hz+ - Gaming / Amiral)</option>
            <option value="ios_iphone">iPhone (iOS)</option>
            <option value="ios_ipad">iPad / Tablet</option>
        </select>
    </div>

    <div class="form-group">
        <label for="dpi">Mevcut DPI Değeriniz (100 - 1000):</label>
        <input type="number" id="dpi" value="410" placeholder="Örn: 480">
    </div>

    <button class="btn-calc" onclick="checkAndCalculate()">Hassasiyet Hesapla 🚀</button>

    <div class="results" id="results">
        <div class="sens-item"><span>Genel Hassasiyet (0-200):</span> <span class="sens-value" id="genel">0</span></div>
        <div class="sens-item"><span>Kırmızı Nokta:</span> <span class="sens-value" id="reddot">0</span></div>
        <div class="sens-item"><span>2x Dürbün:</span> <span class="sens-value" id="scope2x">0</span></div>
        <div class="sens-item"><span>4x Dürbün:</span> <span class="sens-value" id="scope4x">0</span></div>
        <div class="sens-item"><span>AWM Dürbünü:</span> <span class="sens-value" id="awm">0</span></div>
        <div class="sens-item"><span>Önerilen Ateş Butonu:</span> <span class="sens-value" id="firebutton">%0</span></div>
        <div class="sens-item"><span>Önerilen DPI:</span> <span class="sens-value" id="recDpi">0</span></div>
    </div>
</div>

<script>
let isTikTokFollowed = false;

// Web Audio API ile Ses Üretici
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playErrorSound() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(160, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(70, audioCtx.currentTime + 0.3);
    
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
    
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    osc.start();
    osc.stop(audioCtx.currentTime + 0.3);
}

function playSuccessSound() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    
    const notes = [523.25, 659.25, 783.99, 1046.50];
    notes.forEach((freq, index) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + (index * 0.08));
        
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime + (index * 0.08));
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + (index * 0.08) + 0.2);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.start(audioCtx.currentTime + (index * 0.08));
        osc.stop(audioCtx.currentTime + (index * 0.08) + 0.2);
    });
}

function followTikTok() {
    isTikTokFollowed = true;
    const btn = document.getElementById('tiktokBtn');
    const status = document.getElementById('tiktokStatus');
    
    btn.classList.add('followed');
    status.innerText = "✓ TikTok Takip Edildi";
    
    // TikTok linkini buraya koyabilirsin
    window.open("https://www.tiktok.com/", "_blank");
}

function checkAndCalculate() {
    const dpiInput = document.getElementById('dpi');
    const dpiVal = parseInt(dpiInput.value);
    const ttBtn = document.getElementById('tiktokBtn');

    // 1. TikTok Takip Kontrolü
    if (!isTikTokFollowed) {
        playErrorSound();
        ttBtn.classList.add('shake-element');
        setTimeout(() => ttBtn.classList.remove('shake-element'), 400);
        alert("Lütfen önce TikTok hesabını takip edin!");
        return;
    }

    // 2. Geçerli DPI Kontrolü
    if (!dpiVal || dpiVal < 100 || dpiVal > 1000) {
        playErrorSound();
        dpiInput.classList.add('shake-element');
        setTimeout(() => dpiInput.classList.remove('shake-element'), 400);
        alert("Lütfen geçerli bir DPI değeri girin! (100 - 1000 arası)");
        return;
    }

    // 3. Hesaplama İşlemi ve Başarı Sesi
    playSuccessSound();
    calculateSensitivity(dpiVal);
}

function calculateSensitivity(dpi) {
    const device = document.getElementById('device').value;
    let baseGenel, baseReddot, base2x, base4x, baseAwm, fireButton, recommendedDpi;

    // 0-200 Skalasına göre değerler
    switch(device) {
        case 'android_low':
            baseGenel = 195; baseReddot = 190; base2x = 185; base4x = 175; baseAwm = 120;
            fireButton = "%42 - %45"; recommendedDpi = 520;
            break;
        case 'android_mid':
            baseGenel = 170; baseReddot = 165; base2x = 155; base4x = 145; baseAwm = 100;
            fireButton = "%45 - %48"; recommendedDpi = 480;
            break;
        case 'android_high':
            baseGenel = 140; baseReddot = 135; base2x = 125; base4x = 115; baseAwm = 85;
            fireButton = "%48 - %52"; recommendedDpi = 420;
            break;
        case 'ios_iphone':
            baseGenel = 130; baseReddot = 125; base2x = 115; base4x = 105; baseAwm = 80;
            fireButton = "%40 - %45"; recommendedDpi = "Varsayılan (120 DXR)";
            break;
        case 'ios_ipad':
            baseGenel = 110; baseReddot = 105; base2x = 95; base4x = 85; baseAwm = 65;
            fireButton = "%50 - %55"; recommendedDpi = "Varsayılan";
            break;
    }

    // Yüksek DPI düzeltmesi
    if (typeof recommendedDpi === 'number' && dpi > recommendedDpi) {
        baseGenel = Math.max(80, baseGenel - 10);
        baseReddot = Math.max(75, baseReddot - 10);
    }

    // Değerleri Ekrana Yazdır
    document.getElementById('genel').innerText = baseGenel;
    document.getElementById('reddot').innerText = baseReddot;
    document.getElementById('scope2x').innerText = base2x;
    document.getElementById('scope4x').innerText = base4x;
    document.getElementById('awm').innerText = baseAwm;
    document.getElementById('firebutton').innerText = fireButton;
    document.getElementById('recDpi').innerText = recommendedDpi;

    document.getElementById('results').style.display = 'block';
}
</script>

</body>
</html>
