<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEON SENS AI - Free Fire Hassasiyet</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
    
    body {
      margin: 0;
      padding: 0;
      font-family: 'Press Start 2P', cursive;
      background: #0a001f;
      color: #ff00ff;
      overflow: hidden;
      height: 100vh;
    }

    /* Neon Kız Arka Plan Animasyonu */
    .bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(45deg, #ff00ff22, #00ffff22);
      z-index: -2;
      animation: neonpulse 8s infinite;
    }

    .neon-girl {
      position: absolute;
      font-size: 180px;
      opacity: 0.15;
      animation: wave 4s infinite alternate ease-in-out;
      filter: drop-shadow(0 0 40px #ff00ff);
      z-index: -1;
    }

    @keyframes wave {
      from { transform: rotate(-12deg) translateY(20px); }
      to { transform: rotate(12deg) translateY(-20px); }
    }

    .gate {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(10, 0, 31, 0.98);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      flex-direction: column;
      text-align: center;
    }

    .main-content {
      display: none;
      padding: 20px;
      height: 100vh;
      overflow-y: auto;
    }

    .neon-text {
      text-shadow: 0 0 10px #ff00ff,
                   0 0 20px #ff00ff,
                   0 0 40px #00ffff;
    }

    button {
      background: transparent;
      border: 3px solid #ff00ff;
      color: #ff00ff;
      padding: 15px 30px;
      font-family: 'Press Start 2P';
      cursor: pointer;
      transition: all 0.3s;
      text-shadow: 0 0 10px #ff00ff;
    }

    button:hover {
      background: #ff00ff;
      color: #000;
      box-shadow: 0 0 30px #ff00ff;
    }

    input, select {
      background: #1a0033;
      border: 2px solid #00ffff;
      color: #ff00ff;
      padding: 10px;
      margin: 10px 0;
      width: 100%;
      max-width: 400px;
    }
  </style>
</head>
<body>

  <!-- Neon Arka Plan -->
  <div class="bg"></div>
  <div class="neon-girl" style="left: 10%; top: 20%;">♀</div>
  <div class="neon-girl" style="right: 15%; top: 40%; animation-delay: 1.2s;">♀</div>
  <div class="neon-girl" style="left: 25%; bottom: 30%; animation-delay: 2.5s;">♀</div>

  <!-- Giriş Kapısı (TikTok Takip) -->
  <div id="gate" class="gate">
    <h1 class="neon-text">🔥 NEON SENS AI 🔥</h1>
    <h2>Garena Free Fire</h2>
    <p style="margin:20px 0; max-width:500px;">
      Siteye girmek için <strong>@wedzx_</strong> TikTok hesabımı takip etmen gerekiyor!
    </p>
    <a href="https://www.tiktok.com/@wedzx_" target="_blank" style="text-decoration:none;">
      <button onclick="checkFollow()">TIKTOK'TA TAKİP ET</button>
    </a>
    <p style="margin-top:30px; font-size:12px;">Takip ettikten sonra "Doğrula" butonuna bas</p>
    <button onclick="verifyFollow()" style="margin-top:10px; background:#00ffff; color:#000;">DOĞRULA & GİR</button>
  </div>

  <!-- Ana İçerik -->
  <div id="main" class="main-content">
    <header style="text-align:center; padding:20px;">
      <h1 class="neon-text">NEON SENS AI v2.0</h1>
      <p>Yapay Zeka Destekli Free Fire Hassasiyet Ayarı</p>
    </header>

    <div style="max-width:700px; margin:0 auto; background:rgba(20,0,50,0.7); padding:30px; border:2px solid #ff00ff;">
      <h2>Hassasiyet Hesapla</h2>
      
      <label>Cihazın:</label><br>
      <select id="device">
        <option value="phone">Telefon (Dokunmatik)</option>
        <option value="tablet">Tablet</option>
        <option value="claw">Claw Oyuncu</option>
        <option value="2finger">2 Parmak</option>
        <option value="3finger">3 Parmak</option>
        <option value="4finger">4 Parmak</option>
      </select><br><br>

      <label>Oynama Tarzın:</label><br>
      <select id="style">
        <option value="rush">Rush / Aggressive</option>
        <option value="tactical">Taktiksel</option>
        <option value="sniper">Sniper / Long Range</option>
        <option value="balanced">Dengeli</option>
      </select><br><br>

      <label>DPI (Fare / Ekran Hassasiyeti):</label><br>
      <input type="number" id="dpi" value="800" placeholder="Örn: 800"><br><br>

      <button onclick="calculateSensitivity()" style="width:100%;">AI İLE HESAPLA</button>

      <div id="result" style="margin-top:30px; padding:20px; background:#000; border:2px solid #00ffff; display:none;"></div>
    </div>

    <footer style="text-align:center; margin-top:40px; opacity:0.7;">
      <p>© wedzx_ • Neon Sens AI • Free Fire 2026</p>
    </footer>
  </div>

  <script>
    function checkFollow() {
      alert("TikTok'a yönlendiriliyorsun... @wedzx_ hesabını takip et ve geri gel!");
    }

    function verifyFollow() {
      if (confirm("Takip ettiğine emin misin?")) {
        document.getElementById("gate").style.display = "none";
        document.getElementById("main").style.display = "block";
      }
    }

    function calculateSensitivity() {
      const device = document.getElementById("device").value;
      const style = document.getElementById("style").value;
      const dpi = parseInt(document.getElementById("dpi").value) || 800;

      let general = Math.floor(80 + Math.random() * 40);
      let scope2x = Math.floor(general * 0.75);
      let scope4x = Math.floor(general * 0.55);
      let redDot = Math.floor(general * 0.85);

      let advice = "";

      if (style === "rush") {
        general = Math.floor(general * 1.15);
        advice = "Hızlı dönmeler için yüksek hassasiyet önerilir!";
      } else if (style === "sniper") {
        general = Math.floor(general * 0.75);
        advice = "Kontrol için daha düşük değerler daha iyi.";
      }

      document.getElementById("result").innerHTML = `
        <h3 style="color:#00ffff;">✅ AI ÖNERİSİ</h3>
        <p><strong>Genel Hassasiyet:</strong> ${general}%</p>
        <p><strong>Red Dot:</strong> ${redDot}%</p>
        <p><strong>2x Scope:</strong> ${scope2x}%</p>
        <p><strong>4x Scope:</strong> ${scope4x}%</p>
        <p style="color:#ff00ff; margin-top:15px;">${advice}</p>
        <small>DPI: ${dpi} • Tarz: ${style.toUpperCase()}</small>
      `;
      document.getElementById("result").style.display = "block";
    }

    // Arka plan neon efekti
    setInterval(() => {
      document.querySelectorAll('.neon-girl').forEach(g => {
        g.style.opacity = 0.1 + Math.random() * 0.15;
      });
    }, 3000);
  </script>
</body>
</html>
